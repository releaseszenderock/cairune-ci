name: Dispatch latest Ubuntu build

on:
  push:
    branches:
      - manual/ubuntu-build-20261003

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Cairune linux-direct build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches             -d '{"ref":"main","inputs":{"SOURCE_REF":"c9006e3c5f490973644d18843c43b7d37345ae4f","CHANNELS":"linux-direct","LABEL":"ubuntu-latest","RETENTION_DAYS":"7","BASELINE_RUN_ID":""}}'
