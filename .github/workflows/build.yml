# Cairune desktop packaging, run on public runners for the private zenderock/cairune.
#
# Dispatched by hand (or by the maintainer's orchestrator with `gh workflow
# run build.yml`). It is never triggered by a push or a pull request, so no
# fork can reach the deploy key.
#
# SHR-007 (D-066): for each selected package it fetches the pinned engines
# (checksum verified), builds with the channel's configuration overlay and
# CAIRUNE_DISTRIBUTION_CHANNEL, names the package, scans it and its build log
# for secrets, and uploads it. A smoke job per package then installs it on a
# fresh runner, launches it with `--smoke-test --smoke-engines`, checks that
# the installation is unchanged and that application data was written where
# the channel puts it, and uninstalls it. A final job writes SHA256SUMS and
# release-manifest.json over every package and scans them together.
#
# SHR-008 (docs/RELEASE.md in the source): each smoke job then runs the
# release smoke stages against the installed package, one launch each
# (scripts/release/release-smoke.mjs): clean install and onboarding, local
# file, loopback article and media URL capture with immediate Library
# appearance, a transfer killed while it runs and recovered on relaunch,
# playback by byte range and a playback position that survives a relaunch,
# the channel's update ownership, and a large fixture Library (built once by
# the release-fixtures job) paged and searched, offline on linux-direct. With
# BASELINE_RUN_ID, an upgrade job per package installs that run's package,
# keeps a Library with it, installs this run's package over it and verifies
# the Library, its items and its media survived. Release smoke logs are
# redacted and scanned on every run and uploaded only when a stage fails.
#
#   windows-direct   NSIS installer (per user)
#   windows-msix     unsigned MSIX with the placeholder identity; the smoke
#                    signs a local copy with an ephemeral certificate that is
#                    never uploaded
#   linux-direct     .deb
#   linux-snap       strict snap built from the snap_store .deb
#
# The builds are unsigned and publish nothing: store identity, signing and
# publishing are SHR-009. The artifacts of a public repository can be
# downloaded by any signed-in GitHub user, so retention is kept short on
# purpose. No step contacts YouTube; yt-dlp is exercised against a local HTTP
# fixture with its generic extractor.
name: Build

run-name: Build ${{ inputs.SOURCE_REF }}${{ inputs.LABEL != '' && format(' ({0})', inputs.LABEL) || '' }}

on:
  workflow_dispatch:
    inputs:
      SOURCE_REF:
        description: 'Branch, tag or commit of zenderock/cairune to build'
        required: true
        type: string
      CHANNELS:
        description: 'Comma-separated packages: windows-direct, windows-msix, linux-direct, linux-snap (or all)'
        required: false
        default: 'all'
        type: string
      LABEL:
        description: 'Optional label shown in the run name (e.g. v1)'
        required: false
        default: ''
        type: string
      RETENTION_DAYS:
        description: 'Days to keep the packages (public repository: keep it short)'
        required: false
        default: '3'
        type: string
      BASELINE_RUN_ID:
        description: 'Optional ID of an earlier Build run whose packages are the supported previous release (upgrade smoke)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  # The upgrade smoke downloads the packages of the baseline run.
  actions: read

concurrency:
  group: build-${{ inputs.SOURCE_REF }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The same redaction fixture as gate.yml: the secret scan must never find it
  # in a package or a log.
  CAIRUNE_CI_SECRET_FIXTURE: cairune-ci-fixture-not-a-secret-5d1f0e7a
  CAIRUNE_CI_REDACT_ENV: CAIRUNE_CI_SECRET_FIXTURE
  # Optional owner-controlled mirror of the pinned engine downloads (D-066.6).
  # Empty: the upstream addresses pinned in packaging/sidecars/manifest.json.
  CAIRUNE_SIDECAR_MIRROR: ${{ vars.CAIRUNE_SIDECAR_MIRROR }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - name: Select packages
        id: plan
        env:
          CHANNELS: ${{ inputs.CHANNELS }}
        run: |
          all='[
            {"id":"windows-direct","runner":"windows-2025","target":"x86_64-pc-windows-msvc","distribution":"direct","overlay":"direct.windows.json","bundle":"--bundles nsis","channel":"direct","os":"windows"},
            {"id":"windows-msix","runner":"windows-2025","target":"x86_64-pc-windows-msvc","distribution":"microsoft_store","overlay":"msix.json","bundle":"--no-bundle","channel":"microsoft-store","os":"windows"},
            {"id":"linux-direct","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","distribution":"direct","overlay":"direct.linux.json","bundle":"--bundles deb","channel":"direct","os":"linux"},
            {"id":"linux-snap","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","distribution":"snap_store","overlay":"snap.json","bundle":"--bundles deb","channel":"snap-store","os":"linux"}
          ]'
          selected="$(tr -d '[:space:]' <<< "${CHANNELS}")"
          if [ -z "${selected}" ] || [ "${selected}" = "all" ]; then
            packages="$(jq -c '.' <<< "${all}")"
          else
            unknown="$(jq -r --arg selected "${selected}" \
              '($selected | split(",")) - [ .[].id ] | join(",")' <<< "${all}")"
            if [ -n "${unknown}" ]; then
              echo "::error::Unknown packages: ${unknown}"
              exit 1
            fi
            packages="$(jq -c --arg selected "${selected}" \
              '($selected | split(",")) as $ids | [ .[] | select(.id as $id | $ids | index($id)) ]' <<< "${all}")"
          fi
          if [ "$(jq 'length' <<< "${packages}")" -eq 0 ]; then
            echo "::error::No package selected"
            exit 1
          fi
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          jq -r '.[].id' <<< "${packages}" | sed 's/^/Package: /' | tee -a "$GITHUB_STEP_SUMMARY"

  package:
    name: Package (${{ matrix.package.id }})
    needs: plan
    runs-on: ${{ matrix.package.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      TARGET: ${{ matrix.package.target }}
      PACKAGE_ID: ${{ matrix.package.id }}
      RELEASE_CHANNEL: ${{ matrix.package.channel }}
      RELEASE_OS: ${{ matrix.package.os }}
    steps:
      # The source is private; a read-only deploy key scoped to zenderock/cairune
      # fetches it. Credentials are not persisted into the checkout.
      - name: Check out private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zenderock/cairune
          ref: ${{ inputs.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Record source commit
        run: |
          sha="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=${sha}" >> "$GITHUB_ENV"
          echo "Source: zenderock/cairune ${SOURCE_REF} @ ${sha} (${PACKAGE_ID})" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          SOURCE_REF: ${{ inputs.SOURCE_REF }}

      - name: Mask redaction fixture in job logs
        run: echo "::add-mask::${CAIRUNE_CI_SECRET_FIXTURE}"

      # Build machine paths must not end up in a shipped binary: the secret
      # scan fails on the builder's home directory. On Linux the workspace and
      # the Cargo home are under it, so Rust and C sources are remapped; on
      # Windows the Cargo home moves out of the user profile (the workspace is
      # on D:) and Rust paths under the profile are remapped.
      - name: Keep build machine paths out of the binaries
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            {
              echo "RUSTFLAGS=--remap-path-prefix=${HOME}=/builder"
              echo "CFLAGS=-ffile-prefix-map=${HOME}=/builder"
              echo "CXXFLAGS=-ffile-prefix-map=${HOME}=/builder"
            } >> "$GITHUB_ENV"
          else
            {
              printf 'CARGO_HOME=%s\\cargo-home\n' "$(cygpath -w "${RUNNER_TEMP}")"
              printf 'RUSTFLAGS=--remap-path-prefix=%s=C:\\builder\n' "$(cygpath -w "${USERPROFILE}")"
            } >> "$GITHUB_ENV"
          fi

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          mapfile -t packages < <(sed -e 's/#.*//' -e 's/[[:space:]]//g' -e '/^$/d' .github/ci/linux-apt-packages.txt)
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "${packages[@]}" squashfs-tools

      - name: Install pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Rust toolchain (version from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version --verbose
          cargo --version

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME || '~/.cargo' }}/registry/index
            ${{ env.CARGO_HOME || '~/.cargo' }}/registry/cache
            ${{ env.CARGO_HOME || '~/.cargo' }}/git/db
            target/release
            !target/release/bundle
          key: cargo-package-${{ matrix.package.id }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-package-${{ matrix.package.id }}-${{ hashFiles('rust-toolchain.toml') }}-

      # Only the verified downloads are cached; fetch.mjs re-verifies each one.
      - name: Restore engine download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/sidecars-cache
          key: sidecars-${{ matrix.package.target }}-${{ hashFiles('packaging/sidecars/manifest.json') }}

      - name: Install frontend dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Fetch Rust dependencies (locked)
        run: cargo fetch --locked

      - name: Generate routes and messages
        run: pnpm run codegen

      - name: Fetch and verify the pinned engines
        run: |
          node scripts/sidecars/fetch.mjs --target "${TARGET}"
          node scripts/sidecars/fetch.mjs --target "${TARGET}" --verify-only

      - name: Build the package
        env:
          CAIRUNE_DISTRIBUTION_CHANNEL: ${{ matrix.package.distribution }}
          OVERLAY: ${{ matrix.package.overlay }}
          BUNDLE: ${{ matrix.package.bundle }}
        run: |
          mkdir -p ci-logs
          overlay="$(pwd)/packaging/tauri/${OVERLAY}"
          if [ "${RUNNER_OS}" = "Windows" ]; then overlay="$(cygpath -w "${overlay}")"; fi
          read -r -a bundle <<< "${BUNDLE}"
          pnpm --filter @cairune/desktop exec tauri build "${bundle[@]}" --config "${overlay}" 2>&1 \
            | tee ci-logs/build.log

      - name: Assemble the MSIX
        if: matrix.package.id == 'windows-msix'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/release/msix-layout.mjs --app-dir target/release --out target/msix-layout
          if ($LASTEXITCODE -ne 0) { throw 'msix layout failed' }
          $makeappx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $makeappx) { throw 'makeappx.exe not found' }
          & $makeappx.FullName pack /o /d target/msix-layout /p target/Cairune.msix 2>&1 |
            Tee-Object -FilePath ci-logs/makeappx.log
          if ($LASTEXITCODE -ne 0) { throw 'makeappx failed' }

      - name: Copy the deb into the snap project
        if: matrix.package.id == 'linux-snap'
        run: cp target/release/bundle/deb/*.deb packaging/snap/cairune.deb

      - name: Build the snap
        if: matrix.package.id == 'linux-snap'
        id: snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        with:
          path: packaging/snap

      - name: Name the package
        env:
          SNAP_FILE: ${{ steps.snap.outputs.snap }}
        run: |
          case "${PACKAGE_ID}" in
            windows-direct) source="$(ls target/release/bundle/nsis/*.exe)" ;;
            windows-msix) source="target/Cairune.msix" ;;
            linux-direct) source="$(ls target/release/bundle/deb/*.deb)" ;;
            linux-snap) source="${SNAP_FILE}" ;;
            *) echo "::error::Unknown package ${PACKAGE_ID}"; exit 1 ;;
          esac
          test -f "${source}"
          node scripts/release/manifest.mjs stage --channel "${RELEASE_CHANNEL}" \
            --os "${RELEASE_OS}" --arch x64 --source "${source}" --dest upload/packages
          mkdir -p upload/locks
          cp "target/sidecars/${TARGET}/engines.lock.json" "upload/locks/${PACKAGE_ID}.engines.lock.json"
          {
            echo "### ${PACKAGE_ID}"
            echo
            echo "Source commit: ${SOURCE_SHA}"
            echo
            ( cd upload/packages && sha256sum -- * ) | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Secret scan (self-test, then the package and the build logs)
        run: |
          node scripts/release/scan-artifacts.mjs --self-test
          node scripts/release/scan-artifacts.mjs --logs ci-logs \
            --engines-lock "target/sidecars/${TARGET}/engines.lock.json" upload/packages

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cairune-${{ matrix.package.id }}-${{ github.run_id }}
          path: upload/
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.RETENTION_DAYS) }}

  release-fixtures:
    name: Release smoke fixtures
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zenderock/cairune
          ref: ${{ inputs.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Mask redaction fixture in job logs
        run: echo "::add-mask::${CAIRUNE_CI_SECRET_FIXTURE}"

      - name: Install Node.js (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install Rust toolchain (version from rust-toolchain.toml)
        run: |
          rustup toolchain install
          cargo --version

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
          key: cargo-release-fixtures-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-fixtures-${{ hashFiles('rust-toolchain.toml') }}-

      # The same commit's repository writes, so the fixture has the schema
      # the packages migrate from.
      - name: Build the large fixture Library
        run: cargo run --locked --release -p cairune-db --example release-smoke-library -- release-fixtures

      - name: Secret scan of the fixtures
        run: node scripts/release/scan-artifacts.mjs release-fixtures

      - name: Upload the fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cairune-release-fixtures-${{ github.run_id }}
          path: release-fixtures/
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.RETENTION_DAYS) }}

  smoke-linux-direct:
    name: Smoke (linux-direct)
    needs: [plan, package, release-fixtures]
    if: ${{ !cancelled() && contains(needs.plan.outputs.packages, '"linux-direct"') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Mask redaction fixture in job logs
        run: echo "::add-mask::${CAIRUNE_CI_SECRET_FIXTURE}"

      - name: Check out private source (smoke scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zenderock/cairune
          ref: ${{ inputs.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Node.js (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download the package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cairune-linux-direct-${{ github.run_id }}
          path: package

      - name: Install
        run: |
          deb="$(ls package/packages/*.deb)"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb "./${deb}"
          find /usr/lib/Cairune /usr/bin/cairune-desktop -type f -print0 | sort -z | xargs -0 sha256sum > install-before.txt

      - name: Launch with the engine smoke
        run: node scripts/desktop-smoke.mjs --binary=/usr/bin/cairune-desktop --engines --timeout-ms=240000

      # yt-dlp's generic extractor against a local HTTP fixture: the packaged
      # engine downloads with the packaged FFmpeg and Deno named exactly as
      # Cairune names them. No request leaves the runner.
      - name: yt-dlp downloads from a local fixture
        run: |
          engines=/usr/lib/Cairune/engines
          mkdir -p fixture download
          "${engines}/ffmpeg" -hide_banner -loglevel error -f lavfi -i testsrc=duration=2:size=160x90:rate=10 \
            -f lavfi -i sine=frequency=440:duration=2 -shortest -c:v mpeg4 -c:a aac fixture/sample.mp4
          python3 -m http.server 8765 --bind 127.0.0.1 --directory fixture &
          server=$!
          trap 'kill "${server}"' EXIT
          for _ in $(seq 1 20); do curl --silent --output /dev/null http://127.0.0.1:8765/ && break; sleep 0.5; done
          "${engines}/yt-dlp" --no-config --no-update --no-js-runtimes --js-runtimes "deno:${engines}/deno" \
            --ffmpeg-location "${engines}/ffmpeg" --no-playlist -o 'download/sample.%(ext)s' \
            http://127.0.0.1:8765/sample.mp4
          "${engines}/ffprobe" -hide_banner -loglevel error -show_entries format=format_name -of csv=p=0 download/sample.mp4

      - name: Download the release smoke fixtures
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cairune-release-fixtures-${{ github.run_id }}
          path: release-fixtures

      # A user PulseAudio server with a null sink as the default, its socket
      # where a desktop session has it (/run/user/<uid>/pulse/native): the
      # release smoke's playback then has somewhere to send its audio, and
      # the check below sees whether a stream arrived.
      - name: Start a sound server with a null sink
        run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio pulseaudio-utils
          runtime="/run/user/$(id -u)"
          if [ ! -d "${runtime}" ]; then
            sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "${runtime}"
          fi
          echo "XDG_RUNTIME_DIR=${runtime}" >> "${GITHUB_ENV}"
          export XDG_RUNTIME_DIR="${runtime}"
          pulseaudio --daemonize=yes --exit-idle-time=-1
          for _ in $(seq 1 20); do [ -S "${runtime}/pulse/native" ] && break; sleep 0.5; done
          pactl load-module module-null-sink sink_name=cairune_null
          pactl set-default-sink cairune_null
          pactl info | grep -E "^(Server Name|Server Version|Default Sink):"

      - name: Release smoke (SHR-008)
        run: |
          # Every stream the sound server sees while the playback stage runs,
          # reduced to the properties that name who played it.
          audio=ci-artifacts/raw/audio
          mkdir -p "${audio}"
          ( while :; do pactl list sink-inputs; sleep 0.2; done ) 2>&1 \
            | grep --line-buffered -E "^Sink Input #|application\.name|application\.process\.binary|media\.name" \
            > "${audio}/sink-inputs.log" &
          poller=$!
          trap 'kill "${poller}" 2>/dev/null || true' EXIT
          # The large Library stage runs without a network: Search is local.
          node scripts/release/release-smoke.mjs --binary=/usr/bin/cairune-desktop --channel=direct \
            --ffmpeg=/usr/lib/Cairune/engines/ffmpeg --large-library=release-fixtures --offline=library

      # WebKitGTK plays the sample's Opus track through GStreamer's
      # autoaudiosink; a stream on the null sink proves the audio path (the
      # PulseAudio client library, the socket, the confinement's audio plug)
      # works. The page mutes the element, so the samples are silent: only
      # the stream is checked.
      - name: The playback reached the sound server
        run: |
          log=ci-artifacts/raw/audio/sink-inputs.log
          if ! grep -q "^Sink Input #" "${log}"; then
            echo "::error::no audio stream reached the sound server during playback"
            exit 1
          fi
          grep -v "^Sink Input #" "${log}" | sed -E 's/^[[:space:]]+//' | sort | uniq -c

      # Run whatever happened, so a leak is found even when nothing is
      # uploaded.
      - name: Redact and scan the release smoke logs
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/sanitize-artifacts.mjs
          node scripts/release/scan-artifacts.mjs ci-artifacts/sanitized

      - name: Upload sanitized release smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-linux-direct-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/sanitized/
          if-no-files-found: ignore
          retention-days: 3

      - name: Installation is unchanged and application data is where it belongs
        run: |
          find /usr/lib/Cairune /usr/bin/cairune-desktop -type f -print0 | sort -z | xargs -0 sha256sum > install-after.txt
          diff install-before.txt install-after.txt
          data="${HOME}/.local/share/app.cairune.desktop"
          test -d "${data}" && test -n "$(ls -A "${data}")"
          test -d "${data}/secrets"
          ls -la "${data}"

      - name: Uninstall
        run: |
          sudo apt-get remove --yes cairune
          test ! -e /usr/bin/cairune-desktop
          test ! -e /usr/lib/Cairune

  smoke-linux-snap:
    name: Smoke (linux-snap)
    needs: [plan, package, release-fixtures]
    if: ${{ !cancelled() && contains(needs.plan.outputs.packages, '"linux-snap"') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Mask redaction fixture in job logs
        run: echo "::add-mask::${CAIRUNE_CI_SECRET_FIXTURE}"

      - name: Check out private source (smoke scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zenderock/cairune
          ref: ${{ inputs.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Node.js (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download the package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cairune-linux-snap-${{ github.run_id }}
          path: package

      - name: Install (strict confinement, unsigned)
        run: |
          snap_file="$(ls package/packages/*.snap)"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb
          sudo snap install core24
          sudo snap install gnome-46-2404 mesa-2404
          sudo snap install --dangerous "./${snap_file}"
          # Connecting an interface that is already connected succeeds.
          sudo snap connect cairune:removable-media
          snap connections cairune
          # removable-media is a manual interface: it must now be connected.
          if ! snap connections cairune | awk '$2 == "cairune:removable-media" && $3 != "-" { found = 1 } END { exit !found }'; then
            echo "::error::cairune:removable-media is not connected"
            exit 1
          fi
          # `snap info --verbose` indents `confinement:` under `notes:`, so the
          # confinement is read from the installed snap's own metadata, and
          # `snap list` must not flag the install as devmode, classic or jailmode.
          confinement="$(awk '$1 == "confinement:" { print $2 }' /snap/cairune/current/meta/snap.yaml)"
          if [ "${confinement}" != "strict" ]; then
            echo "::error::the installed snap declares confinement '${confinement:-<none>}', expected strict"
            exit 1
          fi
          notes="$(snap list cairune | awk '$1 == "cairune" { print $NF }')"
          case "${notes}" in
            *devmode*|*classic*|*jailmode*)
              echo "::error::the snap is installed with '${notes}', expected strict confinement"
              exit 1
              ;;
          esac
          echo "Confinement: ${confinement} (snap list notes: ${notes})"
          find /snap/cairune/current/ -type f -print0 | sort -z | xargs -0 sha256sum > install-before.txt

      # What the snap's graphics stack resolves to inside the confinement.
      # The gnome extension defers graphics to the gpu-2404 interface
      # (mesa-2404): its wrapper puts the provider's libraries, DRI and VA
      # drivers on LD_LIBRARY_PATH and its EGL vendor files on
      # __EGL_VENDOR_LIBRARY_DIRS, and sets no LIBGL_DRIVERS_PATH, since
      # Mesa 24.3 and later links its drivers into libgallium instead of
      # loading them from the DRI directory. Fails when the provider is not
      # connected or empty, when no EGL vendor file names a library the
      # loader finds, or when the snap stages a Mesa of its own that would
      # shadow the provider's.
      - name: The snap finds the GPU userspace of its provider
        run: |
          # shellcheck disable=SC2016
          snap run --shell cairune -c '
            arch=x86_64-linux-gnu
            status=0
            fail() { echo "FAIL: $*"; status=1; }
            for name in LIBGL_DRIVERS_PATH __EGL_VENDOR_LIBRARY_DIRS LIBVA_DRIVERS_PATH GBM_BACKENDS_PATH LD_LIBRARY_PATH; do
              printf "%s=%s\n" "${name}" "$(printenv "${name}" || echo "<unset>")"
            done
            snapctl is-connected gpu-2404 || fail "the gpu-2404 interface is not connected"
            # The DRI directory: LIBGL_DRIVERS_PATH when set, else the one the
            # provider puts on LD_LIBRARY_PATH.
            dri="${LIBGL_DRIVERS_PATH:-}"
            if [ -z "${dri}" ]; then
              dri="$(printf "%s" "${LD_LIBRARY_PATH:-}" | tr ":" "\n" | grep -E "/dri/?$" | head -n 1)"
            fi
            count="$(find "${dri:-/nonexistent}" -maxdepth 1 -name "*_dri.so" 2>/dev/null | wc -l)"
            echo "DRI directory: ${dri:-<none>} (${count} *_dri.so)"
            [ "${count}" -gt 0 ] || fail "no *_dri.so in the DRI directory"
            # The Mesa EGL vendor file, and the library it names on the search path.
            vendor=""
            for dir in $(printf "%s" "${__EGL_VENDOR_LIBRARY_DIRS:-}" | tr ":" " "); do
              [ -f "${dir}/50_mesa.json" ] && vendor="${dir}/50_mesa.json" && break
            done
            echo "EGL vendor file: ${vendor:-<none>}"
            if [ -z "${vendor}" ]; then
              fail "no Mesa EGL vendor file on __EGL_VENDOR_LIBRARY_DIRS"
            else
              library="$(sed -nE "s/.*\"library_path\"[[:space:]]*:[[:space:]]*\"([^\"]+)\".*/\1/p" "${vendor}")"
              found=""
              for dir in $(printf "%s" "${LD_LIBRARY_PATH:-}" | tr ":" " "); do
                [ -e "${dir}/${library}" ] && found="${dir}/${library}" && break
              done
              echo "EGL vendor library: ${library:-<none>} -> ${found:-<not found>}"
              [ -n "${found}" ] || fail "the EGL vendor library is not on LD_LIBRARY_PATH"
              gallium="$(find "$(dirname "${found:-/nonexistent/x}")" -maxdepth 1 -name "libgallium-*.so" 2>/dev/null | head -n 1)"
              echo "Gallium: ${gallium:-<none>}"
              [ -n "${gallium}" ] || fail "no libgallium next to the EGL vendor library"
            fi
            # A Mesa staged in the snap itself would shadow the provider.
            for shadow in "${SNAP}/usr/lib/${arch}/libEGL_mesa.so.0" "${SNAP}/usr/lib/${arch}/libGLX_mesa.so.0" "${SNAP}/usr/lib/${arch}/dri"; do
              [ -e "${shadow}" ] && fail "the snap stages ${shadow#"${SNAP}"/}"
            done
            ls "${SNAP}/usr/lib/${arch}"/libgallium-*.so >/dev/null 2>&1 && fail "the snap stages libgallium"
            exit "${status}"
          '

      - name: Launch with the engine smoke
        run: node scripts/desktop-smoke.mjs --binary=/snap/bin/cairune --engines --timeout-ms=240000

      - name: Download the release smoke fixtures
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cairune-release-fixtures-${{ github.run_id }}
          path: release-fixtures

      # The same stages in the same order as one run, split in three launches
      # of the runner so that only `playback` runs with GStreamer and
      # WebKit's media logging on (its stderr lands in the stage log). The
      # fixtures directory carries over between launches, as it does for the
      # upgrade job. `snap run` passes GST_DEBUG through, and the gnome
      # extension's desktop-launch leaves it alone.
      # A user PulseAudio server with a null sink as the default, its socket
      # where a desktop session has it (/run/user/<uid>/pulse/native): the
      # release smoke's playback then has somewhere to send its audio, and
      # the check below sees whether a stream arrived.
      - name: Start a sound server with a null sink
        run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio pulseaudio-utils
          runtime="/run/user/$(id -u)"
          if [ ! -d "${runtime}" ]; then
            sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "${runtime}"
          fi
          echo "XDG_RUNTIME_DIR=${runtime}" >> "${GITHUB_ENV}"
          export XDG_RUNTIME_DIR="${runtime}"
          pulseaudio --daemonize=yes --exit-idle-time=-1
          for _ in $(seq 1 20); do [ -S "${runtime}/pulse/native" ] && break; sleep 0.5; done
          pactl load-module module-null-sink sink_name=cairune_null
          pactl set-default-sink cairune_null
          pactl info | grep -E "^(Server Name|Server Version|Default Sink):"

      - name: Release smoke (SHR-008)
        run: |
          smoke=(node scripts/release/release-smoke.mjs --binary=/snap/bin/cairune --channel=snap_store)
          "${smoke[@]}" --ffmpeg=/snap/cairune/current/usr/lib/Cairune/engines/ffmpeg \
            --stages=init,capture,interrupt,recover
          # Every stream the sound server sees while the playback stage runs,
          # reduced to the properties that name who played it.
          audio=ci-artifacts/raw/audio
          mkdir -p "${audio}"
          ( while :; do pactl list sink-inputs; sleep 0.2; done ) 2>&1 \
            | grep --line-buffered -E "^Sink Input #|application\.name|application\.process\.binary|media\.name" \
            > "${audio}/sink-inputs.log" &
          poller=$!
          trap 'kill "${poller}" 2>/dev/null || true' EXIT
          GST_DEBUG='2,webkit*:4' GST_DEBUG_NO_COLOR=1 "${smoke[@]}" --stages=playback
          kill "${poller}" 2>/dev/null || true
          "${smoke[@]}" --large-library=release-fixtures --stages=playback-verify,policy,library

      # WebKitGTK plays the sample's Opus track through GStreamer's
      # autoaudiosink; a stream on the null sink proves the audio path (the
      # PulseAudio client library, the socket, the confinement's audio plug)
      # works. The page mutes the element, so the samples are silent: only
      # the stream is checked.
      - name: The playback reached the sound server
        run: |
          log=ci-artifacts/raw/audio/sink-inputs.log
          if ! grep -q "^Sink Input #" "${log}"; then
            echo "::error::no audio stream reached the sound server during playback"
            exit 1
          fi
          grep -v "^Sink Input #" "${log}" | sed -E 's/^[[:space:]]+//' | sort | uniq -c

      # Diagnostics only (the verdict is already failed): what GStreamer sees
      # inside the confinement, whether a confined process reaches a loopback
      # port, and the playback stage again under two variants that each rule
      # a cause in or out.
      - name: Snap playback diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          out=ci-artifacts/raw/snap-playback
          mkdir -p "${out}"
          arch=x86_64-linux-gnu

          # The environment desktop-launch gives the application, and the
          # media plugins on each GStreamer path. The single-quoted scripts
          # expand inside the confinement, not here.
          # shellcheck disable=SC2016
          snap run --shell cairune -c '
            env | grep -E "^(GST_[A-Z_]*|LD_LIBRARY_PATH|SNAP_DESKTOP_RUNTIME|XDG_CACHE_HOME|GIO_MODULE_DIR|WEBKIT_[A-Z_]*)=" | sort
            for dir in $(printf "%s" "${GST_PLUGIN_PATH}:${GST_PLUGIN_SYSTEM_PATH}" | tr ":" " "); do
              echo "== ${dir}"
              find "${dir}" -maxdepth 1 -name "*.so" -printf "%f\n" 2>&1 | sort | grep -E "vpx|matroska|opus|playback|typefind|app|audioconvert|audioresample|videoconvert|autodetect|pulse|pipewire|opengl|coreelements|libav|subparse" || true
            done
            echo "== registry"
            ls -la "${XDG_CACHE_HOME:-$HOME/.cache}/gstreamer-1.0" 2>&1
            echo "== scanner"
            ls -la "${GST_PLUGIN_SCANNER:-<unset>}" 2>&1
          ' > "${out}/snap-environment.txt" 2>&1 || true
          # Whether a caller's GStreamer variables reach the application, as
          # the smoke above and variant A below rely on.
          # shellcheck disable=SC2016
          GST_DEBUG=probe-debug GST_PLUGIN_SYSTEM_PATH=/probe-system-path snap run --shell cairune -c '
            echo "passed through: GST_DEBUG=${GST_DEBUG:-<unset>} GST_PLUGIN_SYSTEM_PATH=${GST_PLUGIN_SYSTEM_PATH:-<unset>}"
          ' >> "${out}/snap-environment.txt" 2>&1 || true

          # Which WebKitGTK the application loads and which helpers the
          # layout gives it: the staged copy or the gnome runtime's.
          {
            for root in /snap/cairune/current /snap/gnome-46-2404/current; do
              echo "== ${root}"
              find "${root}/usr/lib/${arch}" -maxdepth 1 \( -name "libwebkit2gtk-4.1.so*" -o -name "libgstreamer-1.0.so*" -o -name "libgstgl-1.0.so*" \) -printf "%f -> %l\n" 2>&1 | sort
              find "${root}/usr/lib/${arch}/webkit2gtk-4.1" -maxdepth 2 -printf "%P\n" 2>&1 | sort
              echo "plugins: $(find "${root}/usr/lib/${arch}/gstreamer-1.0" -maxdepth 1 -name "*.so" 2>/dev/null | wc -l)"
            done
            snap list core24 gnome-46-2404 mesa-2404 cairune
          } > "${out}/snap-libraries.txt" 2>&1 || true

          # A loopback connection from inside the confinement (network plug).
          python3 -m http.server 8799 --bind 127.0.0.1 --directory "${out}" > /dev/null 2>&1 &
          server=$!
          for _ in $(seq 1 20); do curl --silent --output /dev/null http://127.0.0.1:8799/ && break; sleep 0.5; done
          # shellcheck disable=SC2016
          snap run --shell cairune -c '
            exec 3<>/dev/tcp/127.0.0.1/8799 || { echo "loopback connect: refused or denied"; exit 0; }
            printf "HEAD / HTTP/1.0\r\n\r\n" >&3
            IFS= read -r status <&3
            echo "loopback connect: ${status}"
          ' > "${out}/snap-loopback.txt" 2>&1 || true
          kill "${server}" || true

          # A: GStreamer limited to the plugins the snap stages itself, as
          # libwebkit2gtk-4.1-0 depends on them (base, good), without the
          # gnome runtime's GL and PipeWire plugins: close to linux-direct,
          # which installs without recommends. desktop-launch keeps a
          # GST_PLUGIN_SYSTEM_PATH the caller sets.
          # B: every plugin, but WebKit's GL video sink off.
          smoke=(node scripts/release/release-smoke.mjs --binary=/snap/bin/cairune --channel=snap_store --stages=playback)
          declare -A verdict
          GST_PLUGIN_SYSTEM_PATH="/snap/cairune/current/usr/lib/${arch}/gstreamer-1.0" \
            GST_DEBUG='2,webkit*:4' GST_DEBUG_NO_COLOR=1 \
            "${smoke[@]}" --logs="${out}/snap-plugins-only" && verdict[snap-plugins-only]=pass || verdict[snap-plugins-only]=fail
          WEBKIT_GST_DISABLE_GL_SINK=1 \
            GST_DEBUG='2,webkit*:4' GST_DEBUG_NO_COLOR=1 \
            "${smoke[@]}" --logs="${out}/no-gl-sink" && verdict[no-gl-sink]=pass || verdict[no-gl-sink]=fail
          {
            for variant in snap-plugins-only no-gl-sink; do echo "${variant}: ${verdict[${variant}]}"; done
          } | tee "${out}/variants.txt"

          # The loopback grant in a media address is short lived and dies
          # with the runner, but it is not kept in an artifact anyway. The
          # environment dump names the runner's home directory (the snap's
          # HOME and XDG_CACHE_HOME live under it), which the artifact scan
          # rejects as a builder path: it becomes <home>, as the smoke logs
          # already write it.
          find ci-artifacts/raw -type f \( -name '*.log' -o -name '*.txt' \) -exec \
            sed -i -E -e 's#(http://127\.0\.0\.1:[0-9]+/)[A-Za-z0-9._~-]+#\1<grant>#g' \
              -e "s#${HOME}#<home>#g" {} +

      # Run whatever happened, so a leak is found even when nothing is
      # uploaded.
      - name: Redact and scan the release smoke logs
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/sanitize-artifacts.mjs
          node scripts/release/scan-artifacts.mjs ci-artifacts/sanitized

      - name: Upload sanitized release smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-linux-snap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/sanitized/
          if-no-files-found: ignore
          retention-days: 3

      - name: Installation is unchanged and application data is in SNAP_USER_COMMON
        run: |
          find /snap/cairune/current/ -type f -print0 | sort -z | xargs -0 sha256sum > install-after.txt
          diff install-before.txt install-after.txt
          common="${HOME}/snap/cairune/common"
          test -d "${common}" && test -n "$(ls -A "${common}")"
          test -d "${common}/secrets"
          ls -la "${common}"

      - name: Uninstall
        run: |
          sudo snap remove --purge cairune
          test ! -e /snap/bin/cairune

  smoke-windows-direct:
    name: Smoke (windows-direct)
    needs: [plan, package, release-fixtures]
    if: ${{ !cancelled() && contains(needs.plan.outputs.packages, '"windows-direct"') }}
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Mask redaction fixture in job logs
        run: echo "::add-mask::${CAIRUNE_CI_SECRET_FIXTURE}"

      - name: Check out private source (smoke scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zenderock/cairune
          ref: ${{ inputs.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Node.js (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download the package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cairune-windows-direct-${{ github.run_id }}
          path: package

      - name: Install silently (per user)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem package/packages/*.exe | Select-Object -First 1
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "installer exited $($process.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Cairune'
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if ($null -eq $exe) { throw 'no application executable was installed' }
          "INSTALL_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "APP_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem $dir -Recurse -File | Sort-Object FullName | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash) $($_.Path)" } | Set-Content install-before.txt

      - name: Launch with the engine smoke
        run: node scripts/desktop-smoke.mjs "--binary=${APP_EXE}" --engines --timeout-ms=240000

      - name: Download the release smoke fixtures
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cairune-release-fixtures-${{ github.run_id }}
          path: release-fixtures

      - name: Release smoke (SHR-008)
        run: |
          node scripts/release/release-smoke.mjs "--binary=${APP_EXE}" --channel=direct \
            "--ffmpeg=${INSTALL_DIR}/engines/ffmpeg.exe" --large-library=release-fixtures

      # Run whatever happened, so a leak is found even when nothing is
      # uploaded.
      - name: Redact and scan the release smoke logs
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/sanitize-artifacts.mjs
          node scripts/release/scan-artifacts.mjs ci-artifacts/sanitized

      - name: Upload sanitized release smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-windows-direct-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/sanitized/
          if-no-files-found: ignore
          retention-days: 3

      - name: Installation is unchanged and application data is where it belongs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem $env:INSTALL_DIR -Recurse -File | Sort-Object FullName | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash) $($_.Path)" } | Set-Content install-after.txt
          if (Compare-Object (Get-Content install-before.txt) (Get-Content install-after.txt)) {
            throw 'the installation directory changed while the application ran'
          }
          $data = Join-Path $env:APPDATA 'app.cairune.desktop'
          $secrets = Join-Path $env:LOCALAPPDATA 'app.cairune.desktop\secrets'
          if (-not (Test-Path $data) -or -not (Get-ChildItem $data)) { throw "no application data in $data" }
          if (-not (Test-Path $secrets)) { throw "no secure store in $secrets" }
          Get-ChildItem $data

      - name: Uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uninstaller = Join-Path $env:INSTALL_DIR 'uninstall.exe'
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "uninstaller exited $($process.ExitCode)" }
          # The NSIS uninstaller copies itself and returns before it finishes.
          for ($i = 0; $i -lt 30 -and (Test-Path $env:APP_EXE); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $env:APP_EXE) { throw 'the application is still installed' }

  smoke-windows-msix:
    name: Smoke (windows-msix)
    needs: [plan, package, release-fixtures]
    if: ${{ !cancelled() && contains(needs.plan.outputs.packages, '"windows-msix"') }}
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Mask redaction fixture in job logs
        run: echo "::add-mask::${CAIRUNE_CI_SECRET_FIXTURE}"

      - name: Check out private source (smoke scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zenderock/cairune
          ref: ${{ inputs.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Node.js (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download the package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cairune-windows-msix-${{ github.run_id }}
          path: package

      # The uploaded MSIX stays unsigned. Windows installs only signed
      # packages, so this job signs a local copy with a certificate created
      # here for the placeholder publisher, trusts it on this runner only, and
      # never uploads the copy, the certificate or its key.
      - name: Sign a local copy with an ephemeral certificate and install it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem package/packages/*.msix | Select-Object -First 1
          $signed = Join-Path $env:RUNNER_TEMP 'Cairune-smoke.msix'
          Copy-Item $msix.FullName $signed
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Cairune Unsigned' `
            -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy NonExportable `
            -NotAfter (Get-Date).AddDays(1) -TextExtension @('2.5.29.19={text}')
          $public = Join-Path $env:RUNNER_TEMP 'cairune-smoke.cer'
          Export-Certificate -Cert $cert -FilePath $public | Out-Null
          Import-Certificate -FilePath $public -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw 'signtool.exe not found' }
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My $signed
          if ($LASTEXITCODE -ne 0) { throw 'signing the smoke copy failed' }
          Add-AppxPackage -Path $signed
          $package = Get-AppxPackage -Name 'Cairune.Unsigned'
          if ($null -eq $package) { throw 'the package is not installed' }
          "PACKAGE_FAMILY=$($package.PackageFamilyName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "INSTALL_DIR=$($package.InstallLocation)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem $package.InstallLocation -Recurse -File | Sort-Object FullName | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash) $($_.Path)" } | Set-Content install-before.txt

      - name: Launch through the execution alias with the engine smoke
        run: node scripts/desktop-smoke.mjs --binary=cairune.exe --engines --timeout-ms=240000

      - name: Download the release smoke fixtures
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cairune-release-fixtures-${{ github.run_id }}
          path: release-fixtures

      # Executables under WindowsApps cannot be started by path from outside
      # their package, so the fixture media are generated with the same
      # packaged FFmpeg taken from the package file itself.
      - name: Take the packaged FFmpeg out of the package file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem package/packages/*.msix | Select-Object -First 1
          $zip = Join-Path $env:RUNNER_TEMP 'cairune-engines.zip'
          Copy-Item $msix.FullName $zip
          $out = Join-Path $env:RUNNER_TEMP 'cairune-engines'
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $ffmpeg = Join-Path $out 'engines\ffmpeg.exe'
          if (-not (Test-Path $ffmpeg)) { throw 'the package carries no engines/ffmpeg.exe' }
          "FIXTURE_FFMPEG=$ffmpeg" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Release smoke (SHR-008)
        run: |
          node scripts/release/release-smoke.mjs --binary=cairune.exe --channel=microsoft_store \
            "--ffmpeg=${FIXTURE_FFMPEG}" --large-library=release-fixtures

      # Run whatever happened, so a leak is found even when nothing is
      # uploaded.
      - name: Redact and scan the release smoke logs
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/sanitize-artifacts.mjs
          node scripts/release/scan-artifacts.mjs ci-artifacts/sanitized

      - name: Upload sanitized release smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-windows-msix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/sanitized/
          if-no-files-found: ignore
          retention-days: 3

      - name: Installation is unchanged and application data is in the package data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem $env:INSTALL_DIR -Recurse -File | Sort-Object FullName | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash) $($_.Path)" } | Set-Content install-after.txt
          if (Compare-Object (Get-Content install-before.txt) (Get-Content install-after.txt)) {
            throw 'the package installation changed while the application ran'
          }
          $data = Join-Path $env:LOCALAPPDATA "Packages\$env:PACKAGE_FAMILY"
          $files = Get-ChildItem $data -Recurse -File -ErrorAction SilentlyContinue
          if ($null -eq $files) { throw "no application data in $data" }
          $files | Select-Object -First 20 -ExpandProperty FullName

      - name: Uninstall and remove the ephemeral trust
        if: always()
        shell: pwsh
        run: |
          Get-AppxPackage -Name 'Cairune.Unsigned' | Remove-AppxPackage
          Get-ChildItem Cert:\LocalMachine\TrustedPeople | Where-Object Subject -eq 'CN=Cairune Unsigned' | Remove-Item
          Get-ChildItem Cert:\CurrentUser\My | Where-Object Subject -eq 'CN=Cairune Unsigned' | Remove-Item
          if (Get-AppxPackage -Name 'Cairune.Unsigned') { throw 'the package is still installed' }

