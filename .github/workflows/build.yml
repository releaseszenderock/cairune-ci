        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-smoke-windows-direct-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/sanitized/
          if-no-files-found: ignore
          retention-days: 3

  upgrade-windows-msix:
    name: Upgrade (windows-msix)
    needs: [plan, package]
    if: ${{ !cancelled() && inputs.BASELINE_RUN_ID != '' && needs.package.result == 'success' && contains(needs.plan.outputs.packages, '"windows-msix"') }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Mask redaction fixture in job logs
        run: echo "::add-mask::${CAIRUNE_CI_SECRET_FIXTURE}"

      - name: Check out private source (smoke scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zenderock/cairune
          ref: ${{ inputs.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Node.js (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download the baseline package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cairune-windows-msix-${{ inputs.BASELINE_RUN_ID }}
          path: baseline
          run-id: ${{ inputs.BASELINE_RUN_ID }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download the package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cairune-windows-msix-${{ github.run_id }}
          path: package

      # Both packages stay unsigned in the artifacts. Local copies are signed
      # with one ephemeral certificate for the placeholder publisher, trusted
      # on this runner only and never uploaded. Windows updates a package only
      # to a higher version, so this package's copy is given the baseline's
      # version plus one in its last field before it is signed.
      - name: Create the ephemeral certificate and install the baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Cairune Unsigned' `
            -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy NonExportable `
            -NotAfter (Get-Date).AddDays(1) -TextExtension @('2.5.29.19={text}')
          $public = Join-Path $env:RUNNER_TEMP 'cairune-smoke.cer'
          Export-Certificate -Cert $cert -FilePath $public | Out-Null
          Import-Certificate -FilePath $public -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $kit) { throw 'signtool.exe not found' }
          "SIGNTOOL=$($kit.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "MAKEAPPX=$(Join-Path $kit.DirectoryName 'makeappx.exe')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $baseline = Join-Path $env:RUNNER_TEMP 'Cairune-baseline.msix'
          Copy-Item (Get-ChildItem baseline/packages/*.msix | Select-Object -First 1).FullName $baseline
          & $kit.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My $baseline
          if ($LASTEXITCODE -ne 0) { throw 'signing the baseline copy failed' }
          Add-AppxPackage -Path $baseline
          $package = Get-AppxPackage -Name 'Cairune.Unsigned'
          if ($null -eq $package) { throw 'the baseline is not installed' }
          "BASELINE_VERSION=$($package.Version)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "INSTALL_DIR=$($package.InstallLocation)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Executables under WindowsApps cannot be started by path from outside
      # their package, so the fixture media are generated with the same
      # packaged FFmpeg taken from the package file itself.
      - name: Take the packaged FFmpeg out of the package file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem baseline/packages/*.msix | Select-Object -First 1
          $zip = Join-Path $env:RUNNER_TEMP 'cairune-engines.zip'
          Copy-Item $msix.FullName $zip
          $out = Join-Path $env:RUNNER_TEMP 'cairune-engines'
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $ffmpeg = Join-Path $out 'engines\ffmpeg.exe'
          if (-not (Test-Path $ffmpeg)) { throw 'the package carries no engines/ffmpeg.exe' }
          "FIXTURE_FFMPEG=$ffmpeg" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Keep a Library with the baseline
        run: |
          node scripts/release/release-smoke.mjs --binary=cairune.exe --channel=microsoft_store \
            "--ffmpeg=${FIXTURE_FFMPEG}" --stages=init,capture

      - name: Install this package over it, one version higher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unpacked = Join-Path $env:RUNNER_TEMP 'msix-upgrade'
          $msix = (Get-ChildItem package/packages/*.msix | Select-Object -First 1).FullName
          & $env:MAKEAPPX unpack /o /p $msix /d $unpacked
          if ($LASTEXITCODE -ne 0) { throw 'makeappx unpack failed' }
          $manifestPath = Join-Path $unpacked 'AppxManifest.xml'
          [xml]$manifest = Get-Content -Raw $manifestPath
          $base = [version]$env:BASELINE_VERSION
          $own = [version]$manifest.Package.Identity.Version
          $next = [version]::new($base.Major, $base.Minor, $base.Build, $base.Revision + 1)
          if ($own -gt $next) { $next = $own }
          $manifest.Package.Identity.Version = $next.ToString()
          $manifest.Save($manifestPath)
          $upgrade = Join-Path $env:RUNNER_TEMP 'Cairune-upgrade.msix'
          & $env:MAKEAPPX pack /o /d $unpacked /p $upgrade
          if ($LASTEXITCODE -ne 0) { throw 'makeappx pack failed' }
          & $env:SIGNTOOL sign /fd SHA256 /sha1 $env:CERT_THUMBPRINT /s My $upgrade
          if ($LASTEXITCODE -ne 0) { throw 'signing the upgrade copy failed' }
          Add-AppxPackage -Path $upgrade
          $package = Get-AppxPackage -Name 'Cairune.Unsigned'
          if ([version]$package.Version -ne $next) { throw "installed version is $($package.Version), expected $next" }

      - name: The Library survived the upgrade
        run: node scripts/release/release-smoke.mjs --binary=cairune.exe --channel=microsoft_store --stages=upgrade-verify

      - name: Redact and scan the release smoke logs
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/sanitize-artifacts.mjs
          node scripts/release/scan-artifacts.mjs ci-artifacts/sanitized

      - name: Upload sanitized upgrade diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-smoke-windows-msix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/sanitized/
          if-no-files-found: ignore
          retention-days: 3

      - name: Uninstall and remove the ephemeral trust
        if: always()
        shell: pwsh
        run: |
          Get-AppxPackage -Name 'Cairune.Unsigned' | Remove-AppxPackage
          Get-ChildItem Cert:\LocalMachine\TrustedPeople | Where-Object Subject -eq 'CN=Cairune Unsigned' | Remove-Item
          Get-ChildItem Cert:\CurrentUser\My | Where-Object Subject -eq 'CN=Cairune Unsigned' | Remove-Item

  release:
    name: Checksums, manifest and secret scan
    needs: [plan, package]
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Mask redaction fixture in job logs
        run: echo "::add-mask::${CAIRUNE_CI_SECRET_FIXTURE}"

      - name: Check out private source (release scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zenderock/cairune
          ref: ${{ inputs.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Node.js (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install unpacking tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends squashfs-tools p7zip-full unzip

      - name: Download every package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cairune-*-${{ github.run_id }}
          path: downloaded

      - name: Write and verify SHA256SUMS and the release manifest
        run: |
          mkdir -p release
          find downloaded -path '*/packages/*' -type f -exec cp {} release/ \;
          locks=()
          while IFS= read -r lock; do locks+=(--engines-lock "${lock}"); done \
            < <(find downloaded -path '*/locks/*.engines.lock.json' -type f | sort)
          node scripts/release/manifest.mjs write --dir release --commit "$(git rev-parse HEAD)" "${locks[@]}"
          node scripts/release/manifest.mjs verify --dir release
          {
            echo "### Release manifest"
            echo
            sed 's/^/    /' release/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Secret scan of every package
        run: |
          node scripts/release/scan-artifacts.mjs --self-test
          locks=()
          while IFS= read -r lock; do locks+=(--engines-lock "${lock}"); done \
            < <(find downloaded -path '*/locks/*.engines.lock.json' -type f | sort)
          node scripts/release/scan-artifacts.mjs "${locks[@]}" release

      - name: Upload the checksums and manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cairune-release-manifest-${{ github.run_id }}
          path: |
            release/SHA256SUMS
            release/release-manifest.json
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.RETENTION_DAYS) }}
