      - name: Install Node.js (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Download the baseline package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cairune-windows-direct-${{ inputs.BASELINE_RUN_ID }}
          path: baseline
          run-id: ${{ inputs.BASELINE_RUN_ID }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download the package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cairune-windows-direct-${{ github.run_id }}
          path: package

      - name: Install the baseline silently (per user)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem baseline/packages/*.exe | Select-Object -First 1
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "installer exited $($process.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Cairune'
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if ($null -eq $exe) { throw 'no application executable was installed' }
          "INSTALL_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "APP_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Keep a Library with the baseline
        run: |
          node scripts/release/release-smoke.mjs "--binary=${APP_EXE}" --channel=direct \
            "--ffmpeg=${INSTALL_DIR}/engines/ffmpeg.exe" --stages=init,capture

      - name: Install this package over it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem package/packages/*.exe | Select-Object -First 1
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "installer exited $($process.ExitCode)" }
          if (-not (Test-Path $env:APP_EXE)) { throw 'the upgraded application is not where the baseline was' }

      - name: The Library survived the upgrade
        run: node scripts/release/release-smoke.mjs "--binary=${APP_EXE}" --channel=direct --stages=upgrade-verify

      - name: Redact and scan the release smoke logs
        if: ${{ !cancelled() }}
        run: |
